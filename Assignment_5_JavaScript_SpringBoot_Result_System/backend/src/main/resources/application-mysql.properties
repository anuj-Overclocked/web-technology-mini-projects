# MySQL Configuration Profile (for production)
# Use this with: java -jar app.jar --spring.profiles.active=mysql

spring.datasource.url=jdbc:mysql://localhost:3306/vit_result_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
