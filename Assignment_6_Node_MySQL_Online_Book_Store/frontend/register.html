  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account | BOOKHUB</title>

<body class="auth-page"><header class="site-header"><nav class="nav container" aria-label="Main navigation"><a class="brand" href="index.html"><span class="brand-mark">B</span> BOOKHUB</a><button class="menu-toggle" aria-label="Open navigation menu" aria-expanded="false">☰</button><div class="nav-links"><a href="index.html">Home</a><a href="catalogue.html">Catalogue</a><a href="login.html">Login</a><a class="nav-cta active" href="register.html">Register</a></div></nav></header>
  <main class="auth-layout container"><div class="auth-intro"><p class="eyebrow">Start your next chapter</p><h1>A little more room for the books you love.</h1><p>Join a community of readers building better shelves, one great book at a time.</p></div><section class="auth-card"><h2>Create account</h2><p class="form-subtitle">It only takes a minute.</p><form id="register-form" novalidate><label for="full-name">Full name</label><input id="full-name" name="fullName" type="text" autocomplete="name" required placeholder="Alex Morgan"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" placeholder="At least 8 characters"><label for="confirm-password">Confirm password</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required placeholder="Repeat your password"><p class="form-message" role="alert" aria-live="polite"></p><button class="button button-primary full-width" type="submit">Create account <span>→</span></button></form><p class="switch-auth">Already a member? <a href="login.html">Sign in</a></p></section></main>
