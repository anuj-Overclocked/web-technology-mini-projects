  <main class="auth-layout container"><div class="auth-intro"><p class="eyebrow">Welcome back</p><h1>Pick up where your story left off.</h1><p>Sign in to keep your reading list close and discover something new.</p></div><section class="auth-card"><h2>Sign in</h2><p class="form-subtitle">Enter your details to continue.</p><form id="login-form" novalidate><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Your password"><p class="form-message" role="alert" aria-live="polite"></p><button class="button button-primary full-width" type="submit">Sign in <span>→</span></button></form><p class="switch-auth">New to BOOKHUB? <a href="register.html">Create an account</a></p></section></main>
